[project]
name = "insurance-rag"
version = "0.1.0"
description = "RAG chatbot for insurance policy Q&A and claim status lookup"
requires-python = ">=3.11,<3.13"

# Every runtime dependency below is permissively licensed (MIT / Apache-2.0 / BSD).
# See docs/ARCHITECTURE.md section 15 for the licence audit.
dependencies = [
  # --- API ---
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1",

  # --- Orchestration ---
  "langgraph>=0.2.50",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-text-splitters>=0.3",

  # --- Embeddings & reranking (self-hosted, zero marginal cost) ---
  "FlagEmbedding>=1.3",          # BAAI/bge-m3: dense + learned-sparse in one pass
  "torch>=2.4",                  # install the CPU wheel explicitly - see README
  "transformers>=4.44",
  "sentencepiece>=0.2",

  # --- Vector store ---
  "qdrant-client>=1.19,<1.20",   # pin: must match the server image in docker-compose

  # --- Document parsing ---
  "docling>=2.0",                # MIT - primary parser
  "pypdfium2>=4.30",             # Apache-2.0 - fast path (NOT PyMuPDF, which is AGPL)
  "python-docx>=1.1",

  # --- Persistence ---
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",

  # --- Jobs & cache ---
  "celery>=5.4",
  "redis>=5.1",                  # client library; the server is Valkey (BSD-3)

  # --- Security ---
  "pyjwt>=2.9",
  "passlib[bcrypt]>=1.7",

  # --- Utilities ---
  "tiktoken>=0.8",
  "structlog>=24.4",
  "httpx>=0.27",
  "tenacity>=9.0",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.39",
  "httpx>=0.27",
  "pandas>=2.2",
]

eval = [
  "ragas>=0.2",
  "datasets>=3.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

observability = [
  "langfuse>=2.53",              # MIT core, self-hosted
]

pii = [
  "presidio-analyzer>=2.2",      # MIT
  "presidio-anonymizer>=2.2",
  "spacy>=3.7",
]

local-llm = [
  "ollama>=0.3",                 # fully-free LLM path; see ARCHITECTURE.md section 4.1
]

dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-requests",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ui*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# B008: FastAPI's File()/Form()/Depends() defaults are the documented idiom.
"app/api/**" = ["B008"]
# S110/S112: the Docling adapter deliberately swallows probe failures while
# walking an API that has changed shape across 2.x releases; each fallback is
# commented at the call site.
"app/ingestion/parsers/docling_parser.py" = ["S110", "S112"]
# The sample corpus is prose: policy clauses read better unwrapped than
# reflowed to fit a linter column.
"scripts/generate_sample_docs.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires the docker-compose stack",
  "security: authorization and injection regression tests",
  "eval: runs against the golden dataset",
]
